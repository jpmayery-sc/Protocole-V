name: Validate Electron Document

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0' # weekly on Sunday 06:00 UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run electron validation
        run: |
          python scripts/validate_electron_document.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: electron-validation-results
          path: results/electron_validation_*

      - name: Commit results back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/electron_validation_*.json results/electron_validation_*.txt || true
          git commit -m "Automated electron validation results" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
